# Static analysis of the Flutter module.
#
# Strict by construction: `dynamic` gets the same treatment as `any` on the TypeScript side, and
# `print()` fails the build rather than warning. See docs/architecture/shared/09-code-quality.md.

include: package:flutter_lints/flutter.yaml

# The same width Prettier uses on the other two ends. Style never differs between modules of
# this repository: a different width produces noise in the diff of whoever moves between them.
formatter:
  page_width: 100

# Architecture rules as lint. Every structural rule of the documentation has a checker, and a
# violation fails the build. See docs/architecture/shared/09-code-quality.md.
plugins:
  import_lint: ^2.0.0

import_lint:
  rules:
    # `domain/` is pure Dart. Not even `material.dart` — that is what makes a use case testable
    # without a WidgetTester.
    domain_is_pure_flutter:
      target: "package:remote_claude/features/*/domain/**"
      from: "package:flutter/**"
      except: []
    domain_is_pure_http:
      target: "package:remote_claude/features/*/domain/**"
      from: "package:dio/**"
      except: []
    domain_is_pure_riverpod:
      target: "package:remote_claude/features/*/domain/**"
      from: "package:riverpod_annotation/**"
      except: []
    domain_is_pure_riverpod_flutter:
      target: "package:remote_claude/features/*/domain/**"
      from: "package:flutter_riverpod/**"
      except: []
    domain_is_pure_socket:
      target: "package:remote_claude/features/*/domain/**"
      from: "package:web_socket_channel/**"
      except: []

    # A widget reads a provider; it never reaches for a repository implementation. The wiring
    # that does live in the feature's composition root, which is not part of `presentation/`.
    presentation_cannot_reach_data:
      target: "package:remote_claude/features/*/presentation/**"
      from: "package:remote_claude/features/*/data/**"
      except: []

    # A feature is imported through its barrel, never by a deep path.
    no_cross_feature_internals_auth:
      target: "package:remote_claude/features/session/**"
      from: "package:remote_claude/features/auth/**"
      except: ["package:remote_claude/features/auth/auth.dart"]
    no_cross_feature_internals_session:
      target: "package:remote_claude/features/auth/**"
      from: "package:remote_claude/features/session/**"
      except: ["package:remote_claude/features/session/session.dart"]

    # The arrow points at `core/`, always. `core/` knowing a feature is a cycle waiting to be
    # written.
    core_cannot_import_features:
      target: "package:remote_claude/core/**"
      from: "package:remote_claude/features/**"
      except: []

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Logging is structured, always. `print` has no level, no structure and no correlation.
    avoid_print: error
    # A rule that only warns is a rule the next tired afternoon ignores.
    always_declare_return_types: error
    always_use_package_imports: error
    missing_required_param: error
    missing_return: error
    # Generated by the l10n tool, which has no say in our lint set.
    unnecessary_string_interpolations: warning

  exclude:
    # Territory of a generator. Never edited by hand, never linted by us.
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/l10n/generated/**

# `public_member_api_docs` is deliberately absent. It demands a doc comment on every
# constructor and every enum value, and "Creates a X." next to `X({required this.y})` is noise
# that dilutes the comments that do say something. What matters — the library, the type and any
# member whose behaviour is not obvious from its name — is documented, and review is what keeps
# it that way.
linter:
  rules:
    - always_declare_return_types
    - always_use_package_imports
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
