# The template's -Xmx8G -XX:MaxMetaspaceSize=4G promised 12 GB of JVM on its own, and the e2e suite
# runs it beside an emulator and the whole stack. A debug build of this app fits comfortably in 3 GB
# of heap; the Kotlin daemon gets its own ceiling, since it does not inherit this one (plan 02, B-29).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
