name: remote_claude
description: >-
  Flutter client of remote-claude: it watches Claude sessions and, above all, approves tool
  permissions from away from the desk.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and dependency injection (ADR-008). The generator makes a wrong
  # dependency a build error instead of a runtime one.
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Declarative routing with deep links, which push notification needs to open one screen.
  go_router: ^17.3.0

  # The network edge: one HTTP client with interceptors, and one socket.
  dio: ^5.10.0
  web_socket_channel: ^3.0.3

  # Credentials live in the operating system's secure store, never in SharedPreferences.
  flutter_secure_storage: ^10.3.1

  # OIDC in the system's external tab. An embedded WebView is forbidden.
  flutter_appauth: ^12.0.2

  # Structured logging: the Dart team's package plus our own JSON formatter.
  logging: ^1.3.0

  # Value equality without hand-written operator==.
  equatable: ^2.0.7

  intl: any
  cupertino_icons: ^1.0.8
  local_auth: ^3.0.2

  # The file browser (plan 25). Markdown preview, exact as the spike measured it (D-06); the parser
  # is imported directly, for the app's own block syntaxes (HTML as code, the `mermaid` fence).
  flutter_markdown_plus: 1.0.12
  markdown: ^7.3.1
  # Mermaid drawn by the web's own engine, in a WebView never on screen (ADR-024, D-10).
  webview_flutter: 4.14.1
  # PDF by PDFium, read by ranges through the app's own client (D-06, D-22). 2.4.8 is the last one
  # for Flutter 3.44; 2.5 asks for 3.47.
  pdfrx: 2.4.8
  # A link of a file leaves the app only after the person confirms the address (B-20).
  url_launcher: ^6.3.2
  # Where a download is written before the system's "save as" (B-27) — it came through other
  # packages; the app now calls it itself.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4

  # Architecture rules as lint: domain purity, the presentation -> data ban and the
  # cross-feature boundary. See docs/architecture/shared/09-code-quality.md.
  import_lint: ^2.0.0

  # Cyclomatic complexity, measured by `node scripts/mobile.mjs analyze`. Not `solid_lints`: it
  # needs an analyzer that `import_lint` 2.0.0 refuses. See D-10 of plan 05.
  dart_code_linter: ^4.4.0

  mocktail: ^1.0.5
  fake_async: ^1.3.3

  # Imported directly by the tests that stand in for a plugin's platform channel, instead of
  # letting a transitive dependency decide what the test compiles against.
  flutter_appauth_platform_interface: ^12.0.1
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  webview_flutter_platform_interface: ^2.14.0
  patrol: ^4.10.0

flutter:
  uses-material-design: true

  # Generates the type-safe accessors of lib/l10n/*.arb. A key that does not exist becomes a
  # compile error, which is the whole reason for ARB over string lookup.
  generate: true

  # The page the app draws Mermaid in. `mermaid.min.js` beside it is copied from the web's
  # node_modules before every build of the app, and is not in git (plan 25, D-20).
  assets:
    - assets/mermaid/

# The real-push suite (plan 02, D-26), run by `node scripts/mobile.mjs test:e2e:push` through
# `patrol`, which is what reaches the notification dialog, the home button and the tray.
patrol:
  app_name: remote_claude
  android:
    package_name: com.remoteclaude.remote_claude
